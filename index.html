<style>
:root{
  --page:#e8d6b0; --pad-face:#5a3a28; --pad-edge:#3a2418; --ab-face:#b4532c; --ab-edge:#7a3220;
  --ink:#f7ebc8; --label:#e2c08a; --pill:#c9a063; --pill-ink:#2b1d1a; --frame:#7a5638;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#1b1528; --pad-face:#4a3424; --pad-edge:#2b1d1a; --ab-face:#a8482a; --ab-edge:#6e2c1a;
    --ink:#f7ebc8; --label:#c9a063; --pill:#3a2a33; --pill-ink:#e8d6b0; --frame:#3a2a52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --page:#1b1528; --pad-face:#4a3424; --pad-edge:#2b1d1a; --ab-face:#a8482a; --ab-edge:#6e2c1a;
  --ink:#f7ebc8; --label:#c9a063; --pill:#3a2a33; --pill-ink:#e8d6b0; --frame:#3a2a52;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);overflow:hidden;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#dpad .v{left:44px;top:0;width:44px;height:132px;border-radius:6px}

#dpad .tri{position:absolute;width:0;height:0;border:7px solid transparent}
#dpad .tu{left:59px;top:10px;border-bottom-color:var(--label)}
#dpad .td{left:59px;bottom:10px;border-top-color:var(--label)}
#dpad .tl{left:10px;top:59px;border-right-color:var(--label)}
#dpad .tr{right:10px;top:59px;border-left-color:var(--label)}
#dpad .arm.on{filter:brightness(1.6)}
#abwrap{width:150px;height:120px}
.ab{position:absolute;width:62px;height:62px;border-radius:50%;background:var(--ab-face);
  border:none;border-bottom:5px solid var(--ab-edge);color:var(--ink);font:700 22px/1 inherit;font-family:inherit;touch-action:none;padding:0}
.ab.on{transform:translateY(3px);border-bottom-width:2px}
#bA{right:0;top:0}
#bB{left:0;top:46px}

.pill.on{filter:brightness(1.3)}
#bMute{display:block}

<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="160" height="144" aria-label="Game screen"></canvas>
    <div id="dpad" class="touch" aria-hidden="true">
      <div class="arm h"></div><div class="arm v"></div><div class="dot"></div>
      <div class="tri tu"></div><div class="tri td"></div><div class="tri tl"></div><div class="tri tr"></div>
    </div>
    <div id="abwrap" class="touch">
      <button class="ab" id="bB" aria-label="B button">B</button>
      <button class="ab" id="bA" aria-label="A button">A</button>
    </div>
    <button class="pill touch" id="bStart" aria-label="Start button">Start</button>
    <button class="pill" id="bMute" aria-label="Sound on or off">Sound on</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   BOOK OF MORMON ADVENTURE — HOW TO ADD A CHAPTER (read before editing)
   Every new chapter plugs into these shared systems. Keep them in use:
   1. CHAPTERS registry: add { id, title, ref, place, x, y, start } so it
      appears as a node on the world map (mapMode). Set locked:true for
      chapters that are planned but not built yet.
   2. Finish every chapter with:  await completeChapter('<id>')
      (awards faith, clears the mid-chapter save, returns to the map).
   3. Plate fragments: add 2 entries to FRAGS for the chapter (a short
      scripture verse each, placed off the main path) and pass
      frags: ['id1','id2'] in a Field.setup cfg. Field collects them.
   4. Faith abilities (hasAbility): swift = faster running, quiet =
      watchers notice slower, steadfast = more courage / lighter hits.
      New mechanics should respect them where they apply.
   5. A climax set piece at the end of each chapter (see signNight).
   6. Music: give big moments their own SONGS entry (map, climax, glory).
   7. Cinematics: cinema(true/false) letterbox, panTo(x, y, frames) and
      releaseCam() for camera moves, lightning(), G.rain, G.shake.
   8. Style: 16-bit palette via ramps/addColor; one signature colour and
      a recognisable prop or feature per major figure (makeChar opts).
   9. Keep dialogue short. Scripture quotes stay exact; narration short.
  11. Map regions: CHAPTERS entries take region:'old' for the Old World;
      portal nodes (toOld/toLand) sail between regions. Shared helpers:
      seaVoyage(), followTrail(), drawSheep(), buildGather() and friends.
  12. Story mode + Mormon framing: add every new chapter to STORY_ORDER
      (book order) and give it a MORMON_NOTES verse. selfCheck() runs at
      start-up and warns in the console about missing registry entries.
  13. Distinct places: Jerusalem (buildJerusalem), Bountiful
      (buildBountiful); the stronghold takes a theme: buildGather('red'|'jungle').
  10. Game name: Book of Mormon Adventure. Home-screen icon is the
      apple-touch-icon in <head>; keep it when editing.
   ===================================================================== */
/* ================= SCREEN & PALETTE ================= */
const W = 160, H = 144;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const imgData = ctx.createImageData(W, H);
const px32 = new Uint32Array(imgData.data.buffer);
const fb = new Uint8Array(W * H);      // colour index 0 (lightest) .. 3 (darkest)
const litMask = new Uint8Array(W * H); // 1 = shown in full palette at night
let litDraw = 0;                       // 2 = UI (full palette), 1 = lamplight

function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
/* 16-bit style colour: the framebuffer holds indices into one shared palette (16+).
   Values 0-3 are "shades" that resolve through the current ramp (light -> dark). */
const PALRGB = [], PALIDX = {};
function addColor(h) { if (h == null) return 255; h = h.toLowerCase(); if (PALIDX[h] == null) { PALRGB.push(hex(h)); PALIDX[h] = 15 + PALRGB.length; } return PALIDX[h]; }
function ramp(a) { return a.map(addColor); }
const RAMP = {
  world: ramp(['#f7ebc8', '#d39a52', '#7d4a35', '#221a35']),   // cream, ochre, umber, night indigo
  ui:    ramp(['#f7ebc8', '#e3c58e', '#a0703f', '#2b1d1a']),   // parchment and ink
};
let curRamp = RAMP.world;
function col(c) { return c < 16 ? curRamp[c & 3] : c; }
function pk(c) { return (255 << 24) | (Math.max(0, Math.min(255, c[2] | 0)) << 16) | (Math.max(0, Math.min(255, c[1] | 0)) << 8) | Math.max(0, Math.min(255, c[0] | 0)); }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function nightOf(c) { return [c[0] * 0.27 + 10, c[1] * 0.31 + 12, c[2] * 0.42 + 40]; }
function warmOf(c) { return [c[0] * 1.06 + 8, c[1] * 0.99 + 2, c[2] * 0.84]; }
const dayT = new Uint32Array(256), nightT = new Uint32Array(256), lampT = new Uint32Array(256);
const G = { lighting: 'day', dawn: 0, fade: 0, fadeWhite: false, shake: 0, frame: 0, cinema: false, bars: 0, rain: 0, flash: 0, dark: 0 };
function setDawn(t) { G.dawn = Math.max(0, Math.min(1, t)); }
function buildTables() {
  const f = Math.min(1, G.fade / 3), to = G.fadeWhite ? [255, 248, 228] : [14, 10, 22];
  const lamp = 0.72 + 0.28 * G.dawn;
  for (let i = 0; i < PALRGB.length; i++) {
    const d = PALRGB[i], n = nightOf(d), k = 16 + i;
    let dc = d, nc = mix(n, d, G.dawn), lc = mix(n, warmOf(d), lamp);
    if (G.dark) { nc = mix(nc, [4, 3, 8], 0.94 * G.dark); lc = mix(lc, [6, 5, 10], 0.5 * G.dark); }
    if (f) { dc = mix(dc, to, f); nc = mix(nc, to, f); lc = mix(lc, to, f); }
    dayT[k] = pk(dc); nightT[k] = pk(nc); lampT[k] = pk(lc);
  }
}

function present() {
  let sx = 0, sy = 0;
  if (G.shake > 0) { sx = ((G.frame * 7) % 5) - 2; sy = ((G.frame * 3) % 3) - 1; G.shake--; }
  buildTables();
  const night = G.lighting === 'night';
  for (let y = 0; y < H; y++) {
    let yy = y - sy; if (yy < 0) yy = 0; else if (yy >= H) yy = H - 1;
    for (let x = 0; x < W; x++) {
      let xx = x - sx; if (xx < 0) xx = 0; else if (xx >= W) xx = W - 1;
      const s = yy * W + xx;
      const c = fb[s], lm = litMask[s];
      px32[y * W + x] = !night || lm === 2 ? dayT[c] : lm === 1 ? lampT[c] : nightT[c];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}
function fillScreen(c) { fb.fill(col(c)); }

/* ================= DRAW PRIMITIVES ================= */
function pset(x, y, c) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x; fb[i] = col(c); if (litDraw) litMask[i] = litDraw;
}
function rect(x, y, w, h, c) {
  x |= 0; y |= 0;
  const x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(W, x + w), y1 = Math.min(H, y + h);
  c = col(c);
  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) { const k = j * W + i; fb[k] = c; if (litDraw) litMask[k] = litDraw; }
}
function frame(x, y, w, h) { // text box frame
  const r0 = curRamp; curRamp = RAMP.ui;
  rect(x, y, w, h, 0); rect(x, y, w, 1, 3); rect(x, y + h - 1, w, 1, 3); rect(x, y, 1, h, 3); rect(x + w - 1, y, 1, h, 3);
  rect(x + 2, y + 2, w - 4, 1, 2); rect(x + 2, y + h - 3, w - 4, 1, 2); rect(x + 2, y + 2, 1, h - 4, 2); rect(x + w - 3, y + 2, 1, h - 4, 2);
  curRamp = r0;
}
// bmp: Uint8Array of indices, 255 = transparent
function blit(bmp, bw, bh, x, y, flip, recolor) {
  x |= 0; y |= 0;
  for (let j = 0; j < bh; j++) {
    const yy = y + j; if (yy < 0 || yy >= H) continue;
    for (let i = 0; i < bw; i++) {
      const xx = x + i; if (xx < 0 || xx >= W) continue;
      let c = bmp[j * bw + (flip ? bw - 1 - i : i)];
      if (c === 255) continue;
      if (recolor) c = recolor[c];
      const k = yy * W + xx; fb[k] = col(c); if (litDraw) litMask[k] = litDraw;
    }
  }
}

/* ================= PIXEL FONT (5x7, upper case) ================= */
const FONT_SRC = {
  A: '01110 10001 10001 11111 10001 10001 10001', B: '11110 10001 10001 11110 10001 10001 11110',
  C: '01110 10001 10000 10000 10000 10001 01110', D: '11110 10001 10001 10001 10001 10001 11110',
  E: '11111 10000 10000 11110 10000 10000 11111', F: '11111 10000 10000 11110 10000 10000 10000',
  G: '01110 10001 10000 10111 10001 10001 01111', H: '10001 10001 10001 11111 10001 10001 10001',
  I: '01110 00100 00100 00100 00100 00100 01110', J: '00111 00010 00010 00010 00010 10010 01100',
  K: '10001 10010 10100 11000 10100 10010 10001', L: '10000 10000 10000 10000 10000 10000 11111',
  M: '10001 11011 10101 10101 10001 10001 10001', N: '10001 10001 11001 10101 10011 10001 10001',
  O: '01110 10001 10001 10001 10001 10001 01110', P: '11110 10001 10001 11110 10000 10000 10000',
  Q: '01110 10001 10001 10001 10101 10010 01101', R: '11110 10001 10001 11110 10100 10010 10001',
  S: '01111 10000 10000 01110 00001 00001 11110', T: '11111 00100 00100 00100 00100 00100 00100',
  U: '10001 10001 10001 10001 10001 10001 01110', V: '10001 10001 10001 10001 10001 01010 00100',
  W: '10001 10001 10001 10101 10101 10101 01010', X: '10001 10001 01010 00100 01010 10001 10001',
  Y: '10001 10001 10001 01010 00100 00100 00100', Z: '11111 00001 00010 00100 01000 10000 11111',
  0: '01110 10001 10011 10101 11001 10001 01110', 1: '00100 01100 00100 00100 00100 00100 01110',
  2: '01110 10001 00001 00010 00100 01000 11111', 3: '11111 00010 00100 00010 00001 10001 01110',
  4: '00010 00110 01010 10010 11111 00010 00010', 5: '11111 10000 11110 00001 00001 10001 01110',
  6: '00110 01000 10000 11110 10001 10001 01110', 7: '11111 00001 00010 00100 01000 01000 01000',
  8: '01110 10001 10001 01110 10001 10001 01110', 9: '01110 10001 10001 01111 00001 00010 01100',
  '.': '00000 00000 00000 00000 00000 01100 01100', ',': '00000 00000 00000 00000 01100 00100 01000',
  '!': '00100 00100 00100 00100 00100 00000 00100', '?': '01110 10001 00001 00010 00100 00000 00100',
  "'": '00100 00100 01000 00000 00000 00000 00000', '"': '01010 01010 10100 00000 00000 00000 00000',
  ':': '00000 01100 01100 00000 01100 01100 00000', ';': '00000 01100 01100 00000 01100 00100 01000',
  '-': '00000 00000 00000 01110 00000 00000 00000', '(': '00010 00100 01000 01000 01000 00100 00010',
  ')': '01000 00100 00010 00010 00010 00100 01000', '/': '00001 00010 00010 00100 01000 01000 10000',
  '>': '01000 01100 01110 01111 01110 01100 01000', '<': '00010 00110 01110 11110 01110 00110 00010',
  '+': '00000 00100 00100 11111 00100 00100 00000', '*': '00000 00100 10101 01110 10101 00100 00000',
  '&': '01100 10010 10100 01000 10101 10010 01101', '#': '01010 11111 01010 01010 11111 01010 00000',
  '▼': '00000 00000 11111 01110 00100 00000 00000', '▲': '00000 00100 01110 11111 00000 00000 00000',
};
const FONT = {};
for (const k in FONT_SRC) FONT[k] = FONT_SRC[k].split(' ').map(r => parseInt(r, 2));
const CHARMAP = { '’': "'", '‘': "'", '“': '"', '”': '"', '—': '-', '–': '-', '…': '.' };
function normText(s) { return s.replace(/[’‘“”—–…]/g, c => CHARMAP[c]); }
function glyph(ch) { return FONT[ch] || FONT[ch.toUpperCase()]; }
function text(str, x, y, c = 3, scale = 1) {
  str = normText(str);
  const r0 = curRamp; curRamp = RAMP.ui;
  let cx = x;
  for (const ch of str) {
    const g = glyph(ch);
    if (g && ch !== ' ') {
      for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (g[r] & (16 >> b)) {
        if (scale === 1) pset(cx + b, y + r, c); else rect(cx + b * scale, y + r * scale, scale, scale, c);
      }
    }
    cx += 6 * scale;
  }
  curRamp = r0;
}
// special icons that are not letters
function icon(name, x, y, c = 3) {
  const g = FONT[name === 'down' ? '▼' : name === 'up' ? '▲' : name]; if (!g) return;
  const r0 = curRamp; curRamp = RAMP.ui;
  for (let r = 0; r < 7; r++) for (let b = 0; b < 5; b++) if (g[r] & (16 >> b)) pset(x + b, y + r, c);
  curRamp = r0;
}

/* ================= LAYOUT (whole-number device-pixel scaling) ================= */

  const start = document.getElementById('bStart'), mute = document.getElementById('bMute');
  const fit = (aw, ah) => { const k = Math.max(1, Math.floor(Math.min(aw * dpr / W, ah * dpr / H))); return [W * k / dpr, H * k / dpr]; };

  if (touch && sw >= sh) { // landscape phone: controls in side columns, never over the screen
    const side = Math.max(150, Math.min(210, sw * 0.22));
    [cw, ch] = fit(sw - side * 2, sh - 16);
    cx = (sw - cw) / 2; cy = (sh - ch) / 2;
    const colL = cx - 4, colR = sw - (cx + cw + 4);
    const sc = Math.min(1, colL / 150, colR / 150, sh / 300);
    dpad.style.transform = ab.style.transform = `scale(${sc})`; dpad.style.transformOrigin = ab.style.transformOrigin = 'top left';
    place(dpad, (colL - 132 * sc) / 2, sh * 0.58 - 66 * sc);

    place(start, (colL - 74) / 2, sh - 44);
    place(mute, cx + cw + 4 + (colR - 104) / 2, 12);
  } else if (touch) { // portrait phone: screen on top, controls below
    const ctrlH = Math.min(240, sh * 0.42);

    cx = (sw - cw) / 2; cy = Math.max(10, (sh - ctrlH - ch) / 2);
    const top = cy + ch + 12, avail = sh - top;

    place(dpad, sw * 0.07, top + (avail - 132 * sc) * 0.38);
    place(ab, sw * 0.93 - 150 * sc, top + (avail - 120 * sc) * 0.38);

    place(mute, (sw - 104) / 2, top + 4);

class TileMap {

  }

  }

}

  };

          if (c.wind === 0) {

        // step along the crowd now and then

        if (c.tx !== undefined && c.wind === 0) { const d = c.tx - c.x; if (Math.abs(d) > 0.5) { c.x += Math.sign(d) * 0.4; c.dir = d > 0 ? 'right' : 'left'; c.anim += 0.4; c.frame = 1 + ((c.anim / 8 | 0) % 2); } }
      }
    }
    // shots
    for (let i = st.shots.length - 1; i >= 0; i--) {
      const s = st.shots[i];
      if (s.type === 'arrow') {
        if (active || s.spent) { s.x += s.vx; s.y += s.vy; }
        if (s.spent) { s.vy += 0.12; s.life -= 2; }
        if (!s.spent && st.inv === 0 && active && Math.hypot(s.x - S.x, s.y - (S.y - 7)) < 6) { falter(); s.spent = true; s.vx = -s.vx * 0.4 + rnd(-0.6, 0.6); s.vy = 0.8; }
        if (--s.life <= 0 || s.y < -6 || s.y > 150 || s.x < -6 || s.x > 166) st.shots.splice(i, 1);
      } else {
        if (active) s.t++;
        if (s.t >= s.dur) {
          if (st.inv === 0 && active && Math.hypot(s.tx - S.x, s.ty - (S.y - 2)) < 9) falter();
          Sound.sfx('thud');
          for (let k = 0; k < 5; k++) st.fx.push({ type: 'chip', x: s.tx, y: s.ty, vx: rnd(-1, 1), vy: rnd(-1.6, -0.4), t: 24 });

    }
    for (let i = st.fx.length - 1; i >= 0; i--) {
      const f = st.fx[i];
      if (f.type === 'ring') { f.r += 1.3; if (f.r > 70) st.fx.splice(i, 1); }
      else { f.x += f.vx; f.y += f.vy; f.vy += 0.15; if (--f.t <= 0) st.fx.splice(i, 1); }
    }

        gd.y += Math.sign(S.y - gd.y) * 0.3;
        if (Math.hypot(gd.x - S.x, gd.y - S.y) < 10) { st.phase = 'caught'; const r = st.resolve; st.resolve = null; r && r(false); break; }
      }

    }
  }
  function draw() {
    G.lighting = 'day';
    for (let tx = 0; tx < 20; tx++) {
      blit(TILES.R.bmp, 8, 8, tx * 8, 8); blit(TILES[tx % 5 === 2 ? 'p' : 'R'].bmp, 8, 8, tx * 8, 16); blit(TILES.r.bmp, 8, 8, tx * 8, 24);
      blit(TILES.p.bmp, 8, 8, tx * 8, 32); blit(TILES.p.bmp, 8, 8, tx * 8, 40);
      blit(TILES.X.bmp, 8, 8, tx * 8, 48); blit(TILES.X.bmp, 8, 8, tx * 8, 56);
      for (let ty = 8; ty < 18; ty++) blit(TILES[ty === 8 ? ',' : 'm'].bmp, 8, 8, tx * 8, ty * 8);
    }
    for (let x = 0; x < 160; x += 8) { rect(x, 30, 5, 2, 2); rect(x, 47, 5, 2, 3); }
    rect(0, 49, 160, 1, 3);
    // preaching rings
    for (const f of st.fx) if (f.type === 'ring') {
      for (let a = 0.15; a < Math.PI - 0.15; a += 0.09) { const px = f.x + Math.cos(a) * f.r, py = f.y + Math.sin(a) * f.r * 0.8; if (((a * 20) | 0) % 2) pset(px, py, f.r > 45 ? 1 : 0); }
    }
    // stone targets
    for (const s of st.shots) if (s.type === 'stone') {
      const r = 3 + 6 * (s.t / s.dur);
      for (let a = 0; a < 6.28; a += 0.5) pset(s.tx + Math.cos(a) * r, s.ty + Math.sin(a) * r * 0.6, (G.frame & 4) ? 3 : 2);
    }
    // aim lines
    for (const c of crowd) if (c.role === 'archer' && c.lock && (G.frame & 2)) {
      const sx = c.x, sy = c.y - 14, dx = c.lock.x - sx, dy = c.lock.y - sy, d = Math.hypot(dx, dy);
      for (let k = 6; k < d + 30; k += 4) pset(sx + dx / d * k, sy + dy / d * k, 3);
    }
    const ents = crowd.filter(c => c.role !== 'gone').concat(st.guards, [S]).sort((a, b) => a.y - b.y);
    for (const e of ents) {
      if (e === S && st.inv > 0 && (G.frame & 2)) continue;
      drawChar(e.spr, e.dir, e.frame, e.x + (e === S && st.flinch > 20 ? ((G.frame & 2) ? 1 : -1) : 0), e.y);
      if (e.role === 'archer') { const bx = Math.round(e.x) + 5, by = Math.round(e.y) - 14; rect(bx, by - 3, 1, 7, 3); pset(bx - 1, by - 4, 3); pset(bx - 1, by + 4, 3); if (e.wind > 0) rect(bx - 6, by, 6, 1, 2); }
      if ((e.role === 'archer' || e.role === 'thrower') && e.wind > 0 && (G.frame & 4)) blit(BUBBLES.alert, 8, 8, Math.round(e.x) - 4, Math.round(e.y) - 26);
    }
    // shots in the air
    for (const s of st.shots) {
      if (s.type === 'arrow') {
        const d = Math.hypot(s.vx, s.vy) || 1, ux = s.vx / d, uy = s.vy / d;
        for (let k = 0; k < 7; k++) pset(s.x - ux * k, s.y - uy * k, k > 4 ? 1 : 3);
      } else {
        const t = s.t / s.dur, x = s.sx + (s.tx - s.sx) * t, gy = s.sy + (s.ty - s.sy) * t, h = Math.sin(Math.PI * t) * 34;
        pset(x, gy, 2); pset(x + 1, gy, 2);
        rect(x - 1, gy - h - 1, 3, 3, 3); pset(x, gy - h - 1, 1);
      }
    }
    for (const f of st.fx) if (f.type === 'chip') pset(f.x, f.y, 3);
  }
  function hud() {
    if (st.phase === 'dash' || st.phase === 'caught') { frame(0, 0, 160, 13); text('RUN ALONG THE WALL', 5, 3, 3); if ((G.frame >> 4) % 2) icon('>', 150, 3, 3); }
    else {
      frame(0, 0, 160, 13); text('WORDS ' + (st.stage + 1) + '/5', 5, 3, 3);
      rect(72, 3, 82, 7, 3); rect(73, 4, 80, 5, 0); rect(73, 4, Math.round(80 * st.prog), 5, 2);
    }

  }

    'Some will shoot arrows or throw stones. Watch for the “!” and the aim lines, and step aside.',
    'The record says they could not hit him. But if one comes close, your words falter.',
  ]);
  for (let s = 0; s < 5; s++) {
    st.stage = s; st.prog = 0; assign(s);
    st.phase = 'play';
    await new Promise(r => { st.resolve = r; });
    st.shots = []; crowd.forEach(c => { c.wind = 0; c.lock = null; });

    await sayAll(WALL_WORDS[s]);
    // some believe, and go to find Nephi
    const listeners = crowd.filter(c => c.role === 'crowd').slice(0, s === 4 ? 3 : 1);
    listeners.forEach(c => c.role = 'leaving');
    if (s === 0) await say('One man in the crowd lowers his head, then hurries away toward the city.');
  }
  await sayAll([
    'Many who heard the words of Samuel believed, and went forth to seek Nephi, that they might be baptized.',

    'Then they cried unto their captains: Take this fellow and bind him!',
  ]);
  for (;;) {
    S.x = 60; S.y = 44; st.inv = 0; st.flinch = 0; st.shots = [];

    if (ok) break;

    await say('A hand catches at your robe, and you pull free. They fall back, and come on again.');
  }
  st.shots = [];
  await say('Samuel cast himself down from off the wall, and fled.');
  await fadeOut();
  await ch2Escape();
}

/* ================= SHARED: cinematics ================= */
function cinema(on) { G.cinema = !!on; }
async function panTo(x, y, frames = 60) {
  const F = Field, m = F.map, sx = F.cam.x, sy = F.cam.y;
  const tx = Math.max(0, Math.min(m.pw - W, x - 80)), ty = Math.max(0, Math.min(m.ph - H, y - 72));
  for (let i = 1; i <= frames; i++) { const k = i / frames, e = k * k * (3 - 2 * k); F.camLock = { x: sx + (tx - sx) * e, y: sy + (ty - sy) * e }; await wait(1); }
}
function releaseCam() { Field.camLock = null; }

  if (G.rain > 0) { const c = addColor('#a9c8e8'); const n = Math.round(70 * G.rain); for (let i = 0; i < n; i++) { const x = (i * 37 + G.frame * 2) % 170 - 6, y = (i * 53 + G.frame * 6) % 150 - 6; pset(x, y, c); pset(x - 1, y + 2, c); pset(x - 2, y + 4, c); } }

}

}

}

function seaVoyage(o) {
  return new Promise(res => {
    const st = { t: 0, x: 80, y: 112, hp: 0, max: 0, inv: 0, obs: [], spawn: 30, buried: 0 };
    let busy = false;
    const reset = () => { st.t = 0; st.x = 80; st.y = 112; st.max = o.noDamage ? 0 : (hasAbility('steadfast') ? 4 : 3); st.hp = st.max; st.obs = []; st.inv = 0; (o.events || []).forEach(e => { e.done = false; }); };
    reset();
    setMode({
      update() {
        if (busy || UI.dlg) return;
        st.t++;
        const k = st.t / o.dur, storm = !!(o.storm && st.t >= o.storm[0] && st.t < o.storm[1]);
        G.rain = storm ? 1 : (o.night ? 0.2 : 0);
        if (storm && Math.random() < 0.012) lightning(4);
        let ax = (Input.held.right ? 1 : 0) - (Input.held.left ? 1 : 0), ay = (Input.held.down ? 1 : 0) - (Input.held.up ? 1 : 0);
        if (storm && o.wild) ax += Math.sin(st.t * 0.04) * 0.9;
        st.x = Math.max(12, Math.min(148, st.x + ax * 1.3)); st.y = Math.max(70, Math.min(128, st.y + ay * 0.9));
        if (--st.spawn <= 0) { st.obs.push({ x: 10 + Math.random() * 140, y: -14, kind: Math.random() < (o.rocks == null ? 0.4 : o.rocks) ? 'rock' : 'wave', sp: 0.7 + k * 0.5 + (storm ? 0.7 : 0) }); st.spawn = (storm ? 16 : 32) - k * 8 + Math.random() * 12; }
        for (const ob of st.obs) ob.y += ob.sp;
        st.obs = st.obs.filter(ob => ob.y < 160);
        if (st.inv > 0) st.inv--; if (st.buried > 0) st.buried--;
        for (const ob of st.obs) if (!ob.hit && Math.abs(ob.x - st.x) < (ob.kind === 'rock' ? 9 : 13) && Math.abs(ob.y - st.y) < 9) {
          ob.hit = true;
          if (o.noDamage) { st.buried = 40; Sound.sfx('thud'); }
          else if (st.inv <= 0) {
            st.hp--; st.inv = 80; G.shake = 10; Sound.sfx('wrong');
            if (st.hp <= 0) { busy = true; (async () => { await say(o.failText || 'The ship is battered by the waves. Try the crossing again.'); reset(); busy = false; })(); }
          }
        }
        for (const ev of o.events || []) if (!ev.done && st.t >= ev.at) { ev.done = true; busy = true; (async () => { await sayAll(ev.lines); busy = false; })(); break; }
        if (st.t >= o.dur) { busy = true; G.rain = 0; res(); }
      },
      draw() {
        const k = st.t / o.dur, storm = !!(o.storm && st.t >= o.storm[0] && st.t < o.storm[1]);
        G.lighting = o.night ? 'night' : 'day'; setDawn(o.night ? 0.25 : 1);
        const deep = addColor(storm ? '#1f4a6e' : '#2a6f9c'), mid = addColor(storm ? '#2c5f86' : '#3a8fb7'), foam = addColor('#dff2f5');
        rect(0, 0, W, H, deep);
        for (let i = 0; i < 40; i++) { const x = (i * 41) % 160, y = ((i * 29) + st.t * (storm ? 2.2 : 1.2)) % 150 - 4; rect(x, y, 8, 1, mid); if (i % 4 === 0) rect(x + 2, y - 1, 3, 1, foam); }
        for (const ob of st.obs) {
          const x = Math.round(ob.x), y = Math.round(ob.y);
          if (ob.kind === 'rock') { rect(x - 7, y - 4, 14, 9, addColor('#5e4a3a')); rect(x - 5, y - 6, 9, 4, addColor('#8f7759')); rect(x - 8, y + 4, 16, 2, foam); }
          else { rect(x - 11, y, 22, 3, addColor('#6fc0d8')); rect(x - 9, y - 2, 18, 2, foam); rect(x - 5, y - 3, 10, 1, foam); }
        }
        if (!(st.inv > 0 && (G.frame >> 2) % 2)) drawShip(st.x, st.y, o.barge, G.frame);
        if (st.buried > 0) { const c = addColor('#163d5e'); for (let y = 0; y < H; y += 2) rect(0, y + (G.frame & 1), W, 1, c); }
      },
      hud() {
        frame(0, 0, 160, 13);
        const days = o.days || 4, d = Math.min(days, 1 + Math.floor(st.t / o.dur * days));
        text('DAY ' + d + ' OF ' + days, 5, 3, 3);
        for (let i = 0; i < st.max; i++) drawHeart(84 + i * 9, 3, i < st.hp);
        if (o.compass) {   // the Liahona: it points the way unless they turn against the Lord
          const storm = !!(o.storm && st.t >= o.storm[0] && st.t < o.storm[1]);
          const cx = 148, cy = 7, a = storm ? G.frame * 0.4 : -Math.PI / 2;
          rect(cx - 4, cy - 4, 9, 9, addColor('#e8ae3a')); rect(cx - 3, cy - 3, 7, 7, addColor('#a8701e'));
          for (let r = 0; r < 4; r++) pset(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), addColor('#fffdf0'));
        }
      },
    });
    fadeIn();
  });
}

function buildShore() {

  fill(0, 0, 40, 3, 'X');
  fill(2, 6, 12, 8, ','); fill(26, 6, 12, 8, ',');
  fill(0, 18, 40, 5, 'p'); fill(0, 23, 40, 7, '~'); fill(18, 22, 5, 2, '=');
  for (const [x, y] of [[4, 8], [10, 11], [28, 8], [35, 11], [7, 13], [31, 13], [1, 9], [38, 7]]) set(x, y, 'T');
  for (const [x, y] of [[30, 17], [31, 17], [33, 17]]) set(x, y, 'B');
  return new TileMap(m.map(r => r.join('')));
}

/* ================= SELF-CHECK: catches registry mistakes before players do ================= */
function selfCheck() {
  const out = [], ids = new Set(CHAPTERS.map(c => c.id));
  for (const c of CHAPTERS) {
    if (c.portal || c.locked) continue;
    if (typeof c.start !== 'function') out.push('chapter ' + c.id + ': no start()');
    if (!c.bonus && chapterOfScene(c.from) !== c.id) out.push('chapter ' + c.id + ': scene ' + c.from + ' maps to ' + chapterOfScene(c.from));
    if (!c.bonus && !STORY_ORDER.includes(c.id)) out.push('chapter ' + c.id + ': missing from STORY_ORDER');
    if (!c.bonus && !MORMON_NOTES[c.id]) out.push('chapter ' + c.id + ': no MORMON_NOTES entry');
    if (!c.bonus && fragsOf(c.id).length !== 2) out.push('chapter ' + c.id + ': ' + fragsOf(c.id).length + ' plate fragments (want 2)');
  }
  for (const id of STORY_ORDER) if (!ids.has(id)) out.push('STORY_ORDER: unknown chapter ' + id);
  for (const k in FRAGS) if (!ids.has(FRAGS[k].ch)) out.push('fragment ' + k + ': unknown chapter ' + FRAGS[k].ch);
  for (const k in SPR) if (!SPR[k] || !SPR[k].down) out.push('sprite ' + k + ' is broken');
  if (out.length) console.warn('SELF-CHECK found problems:\n' + out.join('\n'));
  return out;
}

function rodDist(px, py) {
  let best = 1e9, seg = 0;
  for (let i = 0; i < ROD.length - 1; i++) {
    const [ax, ay] = ROD[i], [bx, by] = ROD[i + 1], dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const u = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L)), d = Math.hypot(px - ax - u * dx, py - ay - u * dy);

  }
  return { d: best, seg };
}
function buildDream() {
  const m = gridOf(32, 48, 'm');

  fill(0, 0, 2, 48, '~'); fill(30, 0, 2, 48, 'X'); fill(0, 47, 32, 1, 'X');
  for (let i = 0; i < ROD.length - 1; i++) { const [ax, ay] = ROD[i], [bx, by] = ROD[i + 1]; const x0 = Math.min(ax, bx) >> 3, x1 = Math.max(ax, bx) >> 3, y0 = Math.min(ay, by) >> 3, y1 = Math.max(ay, by) >> 3; fill(x0, y0, x1 - x0 + 1, y1 - y0 + 1, 'p'); }

}

function followTrail(members, gap = 14) {   // members walk in a line behind the player
  const tr = Field.trail;
  members.forEach((m, k) => {
    const idx = tr.length - 1 - gap * (k + 1), tg = idx >= 0 ? tr[idx] : (tr[0] || { x: m.x, y: m.y });
    const dx = tg.x - m.x, dy = tg.y - m.y, d = Math.hypot(dx, dy);
    if (d > 0.6) { const sp = Math.min(d, 1.9); m.x += dx / d * sp; m.y += dy / d * sp; m.moving = true; m.anim += sp; m.frame = 1 + ((m.anim / 8 | 0) % 2); m.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); }
  });
}
function drawBolt(x, y, seed) {

}
function drawFire(x, y, t) {
  const cs = [addColor('#ffd968'), addColor('#f2a46a'), addColor('#c2453a')];
  for (let i = 0; i < 7; i++) { const h = 3 + ((t * 3 + i * 17) % 7), fx = x + i * 2 - 7 + (((t >> 2) + i) % 2); rect(fx, y - h, 2, h, cs[(i + (t >> 3)) % 3]); }
}

  const P = Field.P;

  const judge = ent({ x: T(32), y: T(12) + 4, dir: 'down', kind: 'npc', spr: SPR.judge, lying: true });
  const comps = [SPR.five2, SPR.five3, SPR.five, SPR.five2].map((s, i) => ent({ x: P.x - 10 + i * 8, y: P.y + 30, dir: 'up', kind: 'npc', spr: s }));
  Field.npcs.push(judge, ...comps);
  await walkTo(P, T(31), T(14) + 4, 0.9);
  await Promise.all(comps.map((c, i) => walkTo(c, T(28) + i * 16 + (i > 1 ? 16 : 0), T(15) + 4, 0.9)));
  P.dir = 'up'; comps.forEach(c => c.dir = 'up');
  await wait(30);
  await say('You come in unto the judgment-seat.');
  await say('And behold, the chief judge has fallen to the earth, and lies dead, even as Nephi said.');
  await say('The five were so astonished that they fell to the earth, for they had not believed.');
  Sound.sfx('heart');
  P.lying = true; comps.forEach(c => c.lying = true);
  await fadeTo(4, true, 6);
  await wait(30);
  G.fadeWhite = false; G.fade = 4;
  setMode(cardMode([]));
  await fadeTo(0);
  await sayAll([
    'The chief judge, Seezoram, had been stabbed by his brother, who came in disguise and fled.',
    'The servants ran and raised the cry of murder. The people gathered at the judgment-seat.',
    'There they found five men lying upon the ground. They supposed the five were the murderers, and that God had struck them down so they could not flee.',
    'They laid hold on the five, and cast them into prison.',
  ]);
  await fadeOut();
  await cjPrison();
}

/* ---------- scene 3: the prison ---------- */
async function cjPrison() {
  State.chapter = 'cj'; State.scene = 33; UI.notebookAllowed = true;
  await sceneBanner(3, 'THE PRISON');
  writeSave({ chapter: 'cj', scene: 33 });
  const talked = new Set();
  const mates = [
    { e: ent({ x: T(4), y: T(6), dir: 'right', spr: SPR.five2 }), who: 'YOUNG MAN', lines: ['I asked for a sign. I said words are cheap.', 'He told us before anyone knew. Before the servants cried out. He knew.'] },
    { e: ent({ x: T(14), y: T(5), dir: 'left', spr: SPR.five3 }), who: 'BEARDED MAN', lines: ['I called Nephi a liar all the way to the judgment-seat.', 'How could a liar know a thing like that?'] },
    { e: ent({ x: T(7), y: T(9) + 4, dir: 'up', spr: SPR.five }), who: 'QUIET MAN', lines: ['They think we killed him. Tomorrow they bury the judge, and then they will judge us.', 'Only God can help us now. I have not prayed in years. Tonight I did.'] },
    { e: ent({ x: T(13), y: T(9) + 4, dir: 'up', spr: SPR.five2 }), who: 'TALL MAN', lines: ['Nephi said it was his brother, who wants the judgment-seat.', 'Seezoram’s brother is Seantum. If the prophet is right about that too...'] },
  ];
  mates.forEach(m => { m.e.kind = 'npc'; m.e.solid = true; });
  const jailer = ent({ x: T(6), y: T(14) + 4, dir: 'up', kind: 'npc', spr: SPR.guard, path: [[T(4), T(14) + 4, 90, 'up'], [T(15), T(14) + 4, 90, 'up']], speed: 0.3 });
  let rested = false;
  const cfg = {
    start: [T(10), T(7)], startDir: 'down', npcs: [...mates.map(m => m.e), jailer], liveDuringScripts: false,
    target() {
      if (talked.size >= 4) return { x: T(17), y: T(7) };
      const P = Field.P; const left = mates.filter(m => !talked.has(m.who));
      left.sort((a, b) => Math.hypot(a.e.x - P.x, a.e.y - P.y) - Math.hypot(b.e.x - P.x, b.e.y - P.y));
      return { x: left[0].e.x, y: left[0].e.y };
    },
    interacts: [
      ...mates.map(m => ({ x: m.e.x, y: m.e.y, r: 16, fn: async () => { face(m.e, Field.P); for (const l of m.lines) await say(l, m.who); talked.add(m.who); if (talked.size === 4) await say('The night is long. Find a place to rest on the straw by the wall.'); } })),
      { x: T(10), y: T(10) + 4, r: 14, fn: async () => { await sayAll([['JAILER', 'Murderers! The whole city will mourn tomorrow.'], ['JAILER', 'They will bury the chief judge, and then the judges will deal with you.']]); } },
      { x: T(17), y: T(7), r: 14, when: () => talked.size >= 4 && !rested, fn: async () => {
        rested = true;
        const c = await choose(['“Nephi is a prophet of God.”', '“I do not know what to believe yet.”'], { title: 'Lying awake, you think about Nephi.' });
        await say(c === 0 ? 'You say it aloud in the dark. The others are quiet, and then one of them says, “Yes.”' : 'But you cannot stop thinking about the judge lying where Nephi said he would be.');
        await fadeOut(false, 8);
        await say('The five spent the night in prison. Before morning, their hearts were changed.');
        await cjAccuse();
      } },
    ],
    hud() { frame(0, 0, 160, 13); text(talked.size < 4 ? 'TALK TO THE OTHERS ' + talked.size + '/4' : 'REST FOR THE NIGHT', 5, 3, 3); },
  };
  Field.setup(PRISON, cfg);
  Field.P.spr = SPR.five;
  setMode(fieldMode());
  Sound.play('night');
  await fadeIn();
  await say('Night in the prison of Zarahemla. The other four sit in silence. Talk to each of them.');
}

/* ---------- scene 4: the accusation ---------- */
async function cjAccuse() {
  State.chapter = 'cj'; State.scene = 34; UI.notebookAllowed = true;
  await sceneBanner(4, 'ACCUSED');
  writeSave({ chapter: 'cj', scene: 34 });
  const judges = [26, 30, 34, 38].map((x, i) => ent({ x: T(x), y: T(12) + 2, dir: 'down', kind: 'npc', spr: SPR.judge }));
  const nephi = ent({ x: T(39), y: T(16), dir: 'left', kind: 'npc', spr: SPR.nephi, hidden: true });
  const comps = [SPR.five2, SPR.five3, SPR.five, SPR.five2].map((s, i) => ent({ x: T(27) + i * 16 + (i > 1 ? 16 : 0), y: T(16) + 4, dir: 'up', kind: 'npc', spr: s }));
  const crowd = [];
  for (let i = 0; i < 10; i++) crowd.push(ent({ x: T(23) + (i % 5) * 32 + (i > 4 ? 12 : 0), y: T(17) + (i > 4 ? 10 : 0), dir: 'up', kind: 'npc', spr: i % 3 ? SPR.citizen : SPR.band }));
  Field.setup(CITY, { start: [T(31) + 4, T(15) + 2], startDir: 'up', npcs: [...judges, nephi, ...comps, ...crowd], lighting: 'day', playerSpr: SPR.five });
  Field.lock++;
  setMode(fieldMode());
  Sound.play('house');
  await fadeIn();
  await sayAll([
    'The next day the people gather to mourn and fast for the chief judge.',
    'The judges who had been at Nephi’s garden asked: Where are the five we sent to see whether the chief judge was dead?',
    'The people answered: We know nothing of five you sent. But we have five murderers in prison.',
    'The five were brought out, and behold, they were the same men.',
    ['JUDGE', 'You five. Tell us what you saw.'],
  ]);
  for (;;) {
    const c = await choose(['“We ran, and saw the judge dead, as Nephi said. We fell to the earth in astonishment.”', '“We saw nothing worth telling.”', '“Nephi must have done it.”']);
    if (c === 0) break;
    await say(c === 1 ? 'The words die in your throat. The others look at you. Tell the truth.' : 'You cannot say it. You do not believe it any more.');
  }
  await sayAll([
    ['YOU', 'When we woke, they cast us into prison. Who did the murder, we do not know. Only this: we found him dead, according to the words of Nephi.'],
    'The five were set free. But the judges were not satisfied.',
    ['JUDGE', 'This Nephi must have agreed with someone to slay the judge, so that he could declare it to us and make himself a great man.'],
    'They had Nephi taken and bound, and brought before the multitude.',
  ]);
  nephi.hidden = false;
  await walkTo(nephi, T(33), T(14) + 4, 0.5); nephi.dir = 'up';
  await sayAll([
    ['JUDGE', 'You are a confederate. Who is the man who did this murder? Tell us, and we will give you money, and spare your life.'],
    ['NEPHI', 'O ye fools, ye blind, ye stiffnecked people! How long will the Lord your God suffer you to go on in this your way of sin?'],
    ['NEPHI', 'Because I have told you of the murder, you say I agreed with the man who did it. Then I will show you another sign.'],
    ['NEPHI', 'Go to the house of Seantum, the brother of Seezoram, and ask him: Has Nephi agreed with thee to murder thy brother?'],
    ['NEPHI', 'He shall say unto you, Nay. Then ask him: Have ye murdered your brother? He shall stand with fear, and deny it, and say that he is innocent.'],
    ['NEPHI', 'But examine him, and ye shall find blood upon the skirts of his cloak.'],
    ['NEPHI', 'Then say: From whence cometh this blood? Is it not the blood of your brother? And he shall tremble, and look pale.'],
    ['NEPHI', 'Then say: Because of this fear and this paleness, we know that thou art guilty. And he shall confess.'],
    ['NEPHI', 'And he shall say that I, Nephi, know nothing of the matter, save it were given unto me by the power of God.'],
  ]);
  State.cjNotes = true; writeSave({ chapter: 'cj', scene: 34, cjNotes: true }); Sound.sfx('learn');
  await say('Nephi’s words are written in your notebook. Press Start to read them.');
  await say('The judges’ men set out for Seantum’s house, and take you as a witness.', 'JUDGE');
  await fadeOut();
  await cjHouse();
}

/* ---------- scene 5: Seantum's house ---------- */
function drawBig(bmp, x0, y0, s, recolor) {
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { let c = bmp[y * 16 + x]; if (c === 255) continue; if (recolor) c = recolor(c, x, y); rect(x0 + x * s, y0 + y * s, s, s, c); }
}
const STAIN = [[5, 13], [6, 13], [9, 12], [10, 13]];
async function cjHouse() {
  State.chapter = 'cj'; State.scene = 35; UI.notebookAllowed = true; State.cjNotes = true;
  await sceneBanner(5, 'SEANTUM');
  writeSave({ chapter: 'cj', scene: 35, cjNotes: true });
  const HOUSE = buildHouseInterior();
  const sea = ent({ x: T(10), y: T(5) + 6, dir: 'down', kind: 'npc', spr: SPR.seantum, solid: true });
  const men = [ent({ x: T(8), y: T(16), dir: 'up', kind: 'npc', spr: SPR.guard }), ent({ x: T(12), y: T(16), dir: 'up', kind: 'npc', spr: SPR.guard })];
  let started = false;
  const cfg = {
    start: [T(10), T(16)], startDir: 'up', npcs: [sea, ...men], frags: ['jd2'], lighting: 'day', playerSpr: SPR.five,
    target: () => started ? null : { x: sea.x, y: sea.y },
    interacts: [{ x: T(10), y: T(9) + 4, r: 20, when: () => !started, fn: async () => { started = true; await interrogate(); } }],
    hud() { frame(0, 0, 160, 13); text('QUESTION SEANTUM', 5, 3, 3); },
  };
  Field.setup(HOUSE, cfg);
  setMode(fieldMode());
  Sound.play('night');
  await fadeIn();
  await say('Seantum waits by the table, calm. Walk up and press A.');
}
async function interrogate() {
  let comp = 40, look = 'calm', shake = 0, examine = null, found = false;
  const sp = SPR.seantum.down[0];
  const big = {
    update() { if (shake > 0) shake--; if (examine) examineUpdate(); },
    draw() {
      G.lighting = 'day';
      for (let ty = 0; ty < 18; ty++) for (let tx = 0; tx < 20; tx++) blit(TILES[ty < 4 ? 'h' : 'f'].bmp, 8, 8, tx * 8, ty * 8);
      const ox = 40 + (shake > 0 ? ((G.frame & 2) ? 1 : -1) : 0), oy = 18;
      drawBig(sp, ox, oy, 5, (c, x, y) => {
        if (look === 'pale' && SPR.seantum.skin.includes(c) && y >= 3 && y <= 6) return addColor('#ead2b4');
        for (const [sx, sy] of STAIN) if (x === sx && y === sy) return found ? addColor('#8a1f24') : SPR.seantum.robe[1];
        return c;
      });
      if (look === 'fear' || look === 'pale') { rect(ox + 6 * 5, oy + 4 * 5 + 1, 5, 2, 0); rect(ox + 9 * 5, oy + 4 * 5 + 1, 5, 2, 0); }
      if (examine) {
        const c = examine;
        for (let i = 0; i < 13; i++) { pset(c.x - 6 + i, c.y - 6, 3); pset(c.x - 6 + i, c.y + 6, 3); pset(c.x - 6, c.y - 6 + i, 3); pset(c.x + 6, c.y - 6 + i, 3); }
        pset(c.x, c.y, 3); pset(c.x - 1, c.y, 0); pset(c.x + 1, c.y, 0);
      }
    },
    hud() {
      frame(0, 0, 160, 13); text('COMPOSURE', 5, 3, 3);
      rect(64, 3, 90, 7, 3); rect(65, 4, 88, 5, 0); rect(65, 4, Math.round(88 * Math.min(100, comp) / 100), 5, comp > 70 && (G.frame & 8) ? 3 : 2);
      if (examine && !UI.dlg) { frame(0, 128, 160, 16); textCenter(examine.msgT > 0 ? examine.msg : 'EXAMINE HIM: D-PAD, A', 132, 3); }
    },
  };
  function examineUpdate() {
    const c = examine; if (UI.dlg) return;
    if (c.msgT > 0) c.msgT--;
    const I = Input.held;
    c.x = Math.max(20, Math.min(140, c.x + ((I.right ? 1 : 0) - (I.left ? 1 : 0)) * 1.4));
    c.y = Math.max(18, Math.min(124, c.y + ((I.down ? 1 : 0) - (I.up ? 1 : 0)) * 1.4));
    if (Input.pressed.start) { UI.notebook = true; return; }
    if (Input.pressed.a) {
      const cx = Math.floor((c.x - 40) / 5), cy = Math.floor((c.y - 18) / 5);
      const near = STAIN.some(([sx, sy]) => Math.abs(sx - cx) <= 1 && Math.abs(sy - cy) <= 1);
      if (near) { const r = c.res; examine = null; Sound.sfx('learn'); r(); return; }
      Sound.sfx('wrong'); comp += 8;
      if (comp >= 100) { const r = c.res; examine = null; r(); return; }
      c.msg = cy >= 2 && cy <= 6 && cx >= 3 && cx <= 12 ? 'HIS FACE IS CALM. TOO CALM.' : cy === 10 && (cx <= 3 || cx >= 12) ? 'HIS HANDS ARE CLEAN.' : cy === 10 ? 'NOTHING ON HIS BELT.' : cy >= 7 && cy <= 13 ? 'LOOK LOWER. THE SKIRTS.' : 'NOTHING THERE.';
      c.msgT = 90;
    }
  }
  const fail = async () => {
    look = 'calm';
    await say('Enough! You come into my house and insult me while my brother lies dead? Get out!', 'SEANTUM');
    await say('The judges’ men lead you outside. Read Nephi’s words again, and try once more.');
    await fadeOut(); await cjHouse();
    throw 'restart';
  };
  const ask = async (opts, correct, costs, title) => {
    const order = shuffle(opts.map((o, i) => i));
    const pick = order[await choose(order.map(i => opts[i]), { title })];
    if (pick === correct) { Sound.sfx('right'); comp = Math.max(0, comp - 8); return true; }
    Sound.sfx('wrong'); comp += costs[pick]; G.shake = 4;
    if (comp >= 100) await fail();
    return false;
  };
  try {
    await fadeOut(); setMode(big); await fadeIn();
    await say('Seantum looks at you calmly.', null);
    await say('Judges’ men in my house, on the day of my brother’s burial? What do you want?', 'SEANTUM');
    // 1
    while (!(await ask(['“Has Nephi agreed with thee to murder Seezoram, thy brother?”', '“Where were you yesterday?”', '“Who leads your secret band?”', '“Did you love your brother?”'], 0, [0, 20, 40, 20], 'Nephi’s first question:'))) await say(comp > 60 ? 'Seantum smiles a little. He is more sure of himself now.' : 'That is not what Nephi told you to ask.', null);
    await say('Nephi? Nay. I have never spoken with the man.', 'SEANTUM');
    // 2
    while (!(await ask(['“Have ye murdered your brother?”', '“Do you know who did it?”', '“Will you sit in the judgment-seat now?”'], 0, [0, 20, 25], 'Then ask him...'))) await say('Seantum shrugs. That gives him nothing to fear.', null);
    look = 'fear'; shake = 30;
    await say('Seantum stands with fear, and for a moment does not know what to say.');
    await say('I? Murder my own brother? How can you ask me such a thing? I am innocent!', 'SEANTUM');
    await say('He makes as if he were astonished. Nephi said to examine him.');
    look = 'calm';
    await new Promise(res => { examine = { x: 80, y: 60, res, msg: '', msgT: 0 }; });
    if (comp >= 100) await fail();
    found = true; look = 'fear';
    await say('There is blood upon the skirts of his cloak.');
    // 4
    while (!(await ask(['“From whence cometh this blood? Is it not the blood of your brother?”', '“Did you cut yourself?”', '“We will have you put to death!”'], 0, [0, 30, 20], 'Ask him about the blood:'))) await say('He collects himself and starts to make excuses.', null);
    look = 'pale'; shake = 60; Sound.sfx('heart');
    await say('Seantum trembles, and his face turns pale, as if death had come upon him.');
    // 5
    while (!(await ask(['“Because of this fear and this paleness, we know that thou art guilty.”', '“Confess, or it will go worse for you.”', '“Perhaps we are mistaken.”'], 0, [0, 20, 40], 'What did Nephi say to tell him?'))) await say('Seantum’s hands steady. Say what Nephi told you to say.', null);
    shake = 40;
    await sayAll([
      'Greater fear comes upon Seantum.',
      ['SEANTUM', 'Yes. I did it. I murdered my brother, Seezoram.'],
      ['SEANTUM', 'And Nephi... he knows nothing of the matter. Nothing, save it were given unto him by the power of God.'],
    ]);
    Sound.sfx('jingle');
    await fadeOut();
    await cjEnding();
  } catch (e) { if (e !== 'restart') throw e; }
}

/* ---------- ending ---------- */
async function cjEnding() {
  State.scene = 36;
  writeSave({ chapter: 1, scene: 1, signs: [false, false, false], checkpoint: null, cjNotes: false });
  const nephi = ent({ x: T(16), y: T(9) + 6, dir: 'down', kind: 'npc', spr: SPR.nephi });
  const crowd = [];
  for (let i = 0; i < 9; i++) crowd.push(ent({ x: T(4) + i * 20, y: T(15) + (i % 2) * 10, dir: 'up', kind: 'npc', spr: [SPR.citizen, SPR.band, SPR.five2][i % 3] }));
  Field.setup(GARDEN, { start: [T(13), T(12)], npcs: [nephi, ...crowd], lighting: 'day' });
  Field.P.hidden = true; Field.lock++;
  setMode({ update() { Field.update(); }, draw() { G.lighting = 'day'; Field.draw(); } });
  Sound.play('house');
  await fadeIn(6);
  await sayAll([
    'It was all as Nephi had said. Nephi was set free, and the five with him.',
    'Some believed the words of Nephi. Others believed because of the five, for they had been converted while in prison.',
    'Some said: Nephi is a prophet.',
    'Others said: Behold, he is a god. How else could he know all things?',
    'And there arose a division among the people.',
  ]);
  crowd.forEach((c, i) => walkTo(c, i % 2 ? -20 : 230, c.y, 0.5));
  await wait(90);
  await sayAll([
    'And Nephi went his way toward his own house, pondering the things the Lord had shown him.',
    'And a voice came unto him: Blessed art thou, Nephi, for those things which thou hast done.',
  ]);
  await fadeOut(false, 8);
  Sound.sfx('jingle');
  await showCard([{ t: 'END OF', big: 1 }, { t: 'CHAPTER 2', big: 1 }, '', 'THE CHIEF JUDGE', { t: 'HELAMAN 7-10', dim: 1 }], { min: 100 });
  await completeChapter('judge');
}
